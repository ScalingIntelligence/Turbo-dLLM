name: GPU validation

on:
  workflow_call:
    inputs:
      release_tag:
        description: Immutable version tag to build and qualify
        required: true
        type: string
      publish_existing_release:
        description: Upload to an existing GitHub release after qualification
        required: false
        default: false
        type: boolean
    secrets:
      MODAL_TOKEN_ID:
        required: true
      MODAL_TOKEN_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to supply with qualified GPU assets
        required: true
        default: v0.1.6
        type: string

      publish_existing_release:
        description: Upload to an existing GitHub release after qualification
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: gpu-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Resolve immutable release source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          echo "SOURCE_REVISION=$(git rev-parse "FETCH_HEAD^{commit}")" >> "$GITHUB_ENV"
      - name: Install build orchestrator
        run: uv pip install --system modal==1.4.3
      - name: Build and qualify coordinated GPU wheels
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ATTENTION_IMAGE: ${{ vars.GPU_ATTENTION_IMAGE }}
        run: |
          python .github/scripts/gpu_release.py \
            --attention-image "$ATTENTION_IMAGE" \
            --release "$RELEASE_TAG" \
            --revision "$SOURCE_REVISION" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir dist-gpu
      - name: Verify GPU release assets and create catalog
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/verify/gpu_release_assets.py \
            --directory dist-gpu \
            --release "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
      - uses: anchore/sbom-action/download-syft@v0
      - name: Generate native SBOMs
        run: |
          for artifact in dist-gpu/*.whl; do
            scripts/build/generate_sbom.sh \
              --artifact "$artifact" --output "$artifact.cdx.json"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist-gpu/*.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-sm90-cu128-cp312
          path: dist-gpu/*
          if-no-files-found: error

  publish-existing-release:
    if: inputs.publish_existing_release
    needs: qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: gpu-sm90-cu128-cp312
          path: dist-gpu
      - name: Publish GPU assets with catalog last
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python .github/scripts/publish_gpu_assets.py \
            --directory dist-gpu --release "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY"
