launch:
  recipe_kind: profile
model:
  id: Qwen/Qwen3-8B
  family: causal_lm
  seq_len: 32768
  mask_token_id: 151665
  dtype: bf16
objective:
  name: fast_dllm_v2
  block_size: 256
  noise_schedule: linear_mask
  loss_weighting: unit
  noise_schedule_epsilon: 0.001
data:
  input_mode: random
training:
  batch_size: 1
  steps: 3
  activation_checkpointing: true
profiler:
  warmup_steps: 1
  phase_timing: true
  phase_timing_sync: true
topology:
  context_parallel_size: 4
  block_parallel_size: 4
  tensor_parallel_size: 1
  sequence_parallel: false
kernel:
  runtime_jit: false
optimizer:
  backend: deepspeed_zero2
  allow_deepspeed_op_build: false
